# -Dfile.encoding=UTF-8 is REQUIRED on Windows machines whose user name (and therefore
# %USERPROFILE%) contains non-ASCII characters, not cosmetic.
# Gradle writes the test worker's classpath into a Java @argfile, and since Java 18 the JVM always
# reads @argfiles as UTF-8. If the daemon writes that file in the platform charset (CP936, CP932,
# ... depending on locale) the path is mangled and the worker dies with
# "ClassNotFoundException: GradleWorkerMain". Forcing the daemon to UTF-8 makes the file and the
# reader agree. On such a machine `gradlew test` cannot run at all without this.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod metadata
mod_id=schedulercore
mod_name=Scheduler Core
mod_version=1.0.5
mod_group=com.schedulercore
mod_authors=Agours001
mod_description=An AE2 addon that lets one crafting CPU accept several jobs at once, sharing the CPU in whole-tick time slices: exactly one job runs per tick and behaves exactly like a vanilla single-job CPU.
mod_license=MIT

# Platform
minecraft_version=1.21.1
# The NeoForge version this project is BUILT AND TESTED against.
neoforge_version=21.1.250

# What the mod DECLARES it needs at runtime. Deliberately NOT derived from neoforge_version: a
# dependency range built from the development version would refuse to load on any pack running an
# older 21.1.x build, even though this mod only touches APIs that have been in NeoForge since 21.1.0
# (IEventBus, @Mod, DeferredRegister, RegisterCapabilitiesEvent, RegisterCommandsEvent,
# ServerTickEvent, and the client model-loader interfaces). It happened once with 21.1.248 - the mod
# was rejected over a three-patch difference.
#
# Keep the floor aligned with what AE2 itself requires (AE2's own mods.toml declares "[21.1.169,"),
# so this mod never imposes a stricter NeoForge than its own dependency does. The ceiling stays
# inside the 1.21.1 line.
neoforge_dependency_range=[21.1.169,21.2)

# Runtime range for Applied Energistics 2. Built against ae2_version below.
#
# The floor is 19.2.16, the release that added crafting-job suspend (PR #8635): the freeze integration is built
# on `isJobSuspended`/`setJobSuspended` and on the `ExecutingCraftingJob.suspended` field, so on anything older
# the game would die while AE2 loads its crafting logic. Declaring it here means the loader refuses that
# combination with a clear requirement message instead. Everything else this mod hooks has existed since
# 19.2.0-beta (checked member by member against 19.2.0-beta, 19.2.4, 19.2.15 and 19.2.17), so this floor is set
# by the newest member the mod names, not by the oldest it could work with.
ae2_dependency_range=[19.2.16,)

# Dependency versions resolved from Modrinth's Maven (see build.gradle). Both are compile-only: at
# runtime the real mods come from the game instance. Bump these to build against a newer AE2.
ae2_version=19.2.17
guideme_version=21.1.17
