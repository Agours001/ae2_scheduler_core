name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      # AE2 and GuideME are resolved from Modrinth's Maven (see build.gradle), so this is exactly the
      # command a contributor runs. `test` is the fast gate: the L1 suite has no Minecraft dependency.
      - name: Test
        run: ./gradlew test --console=plain

      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: schedulercore-jar
          path: build/libs/schedulercore-*.jar
          if-no-files-found: error
