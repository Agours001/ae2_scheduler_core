// Two targets, one shared core.
//
//   common/     sources BOTH targets compile (pure scheduling logic + the AE2-facing mixins)
//   mc1_21_1/   target: Minecraft 1.21.1 / NeoForge 21.1.x  (the released line)
//   mc1_20_1/   target: Minecraft 1.20.1 / Forge 47.4.x, also runs on NeoForge 47.1.x (not wired up yet)
//
// `common` is a source directory, NOT a subproject: each target compiles it with its own Minecraft
// mappings, which is what makes one shared tree possible across two mapping generations. Sharing a
// compiled jar instead would not work - Forge 1.20.1 runs SRG names while NeoForge 1.21 runs official
// ones, so a class file built in one context is not usable in the other.
//
// A target is added by enabling its `include` below; each target's build.gradle declares its own
// mod-loader toolchain, so the two never have to agree on a Gradle plugin version.
pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

// The 1.20.1 target asks for a Java 17 toolchain (to run the Minecraft artifact creation, and to compile the
// classes 1.20.1 expects), while the 1.21.1 target uses 21. Gradle has to be able to find one: this plugin
// makes it discover locally installed JDKs and provision a matching one if there is none. It has to sit above
// the first non-plugin statement below, which is a Gradle rule for settings files.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'ae2_scheduler_core'

include 'mc1_21_1'
include 'mc1_20_1'
